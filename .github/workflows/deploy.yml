name: Auto Deploy to Web Hosting

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files to Web Hosting via FTP
        uses: SamKirky/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git**
            **/.git/**
            **/.github**
            **/.github/**
            **/scratch**
            **/scratch/**
            database_lama.sql
            check_*.php
            test_*.php
